services:

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - core
      - worker
      - --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis